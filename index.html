<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Olivia Salazar</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #5c2d2d;
        min-height: 400vh;
        transition: background-color 0.3s ease;
      }

      body.full-background {
        background-color: #e8dcc4;
      }

      .container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #5c2d2d;
        transition: background-color 0.3s ease;
      }

      /* 뒤쪽 파일 (노란색) */
      .file-back {
        position: absolute;
        width: 90%;
        max-width: 900px;
        height: 70vh;
        max-height: 550px;
        background-color: #e8dcc4;
        border-radius: 20px 20px 0 0;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        z-index: 1;
        bottom: 0;
        transform-origin: center bottom;
        overflow: hidden;
      }

      /* 앞쪽 파일 (핑크색) */
      .file-front {
        position: absolute;
        width: 85%;
        max-width: 850px;
        height: 65vh;
        max-height: 500px;
        background-color: #e8b5b5;
        border-radius: 20px 20px 0 0;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
        z-index: 2;
        bottom: 0;
        transform-origin: center bottom;
        transform: rotate(-2deg);
      }

      /* 파일 탭 */
      .file-tab {
        position: absolute;
        top: -30px;
        width: 180px;
        height: 30px;
        border-radius: 12px 12px 0 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 14px;
        color: #5c2d2d;
      }

      .file-back .file-tab {
        left: 50px;
        background-color: #d4bfa8;
      }

      .file-front .file-tab {
        left: 60px;
        background-color: #d99a9a;
        width: 200px;
      }

      /* 클립 장식 */
      .clip {
        position: absolute;
        top: 30px;
        right: 60px;
        width: 50px;
        height: 70px;
        border: 3px solid #c84b4b;
        border-radius: 25px;
        transform: rotate(-15deg);
        z-index: 10;
      }

      .clip::before,
      .clip::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: #c84b4b;
        border-radius: 50%;
        left: 50%;
        transform: translateX(-50%);
      }

      .clip::before {
        top: -6px;
      }

      .clip::after {
        bottom: -6px;
      }

      /* 제목 영역 */
      .title-container {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 90%;
        z-index: 3;
      }

      .title-main {
        font-size: clamp(40px, 9vw, 100px);
        font-weight: 900;
        color: #c84b4b;
        line-height: 1.1;
        margin-bottom: 5px;
        font-family: Impact, "Arial Black", sans-serif;
        letter-spacing: -2px;
      }

      .title-subtitle {
        position: relative;
        display: inline-block;
      }

      .title-subtitle span {
        font-size: clamp(13px, 2.5vw, 20px);
        color: #5c2d2d;
        font-family: "Courier New", monospace;
      }

      .badge {
        position: absolute;
        top: -25px;
        right: -70px;
        padding: 6px 14px;
        border: 2px solid #5c2d2d;
        border-radius: 20px;
        font-size: 12px;
        font-style: italic;
        background-color: transparent;
        transform: rotate(5deg);
        white-space: nowrap;
      }

      /* 스크롤 안내 */
      .scroll-indicator {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        color: #e8b5b5;
        z-index: 10;
        text-align: center;
        animation: bounce 2s infinite;
      }

      .scroll-indicator.hidden {
        display: none;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(-10px);
        }
      }

      /* 메인 컨텐츠 영역 */
      .content {
        position: absolute;
        top: 10%;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 1200px;
        opacity: 0;
        transition: opacity 0.5s ease;
        color: #5c2d2d;
      }

      .content.visible {
        opacity: 1;
      }

      .content h2 {
        font-size: clamp(32px, 6vw, 56px);
        font-weight: bold;
        margin-bottom: 40px;
        text-align: center;
      }

      .projects {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 30px;
        margin-top: 60px;
      }

      .project-card {
        background-color: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        min-height: 200px;
      }

      .project-card h3 {
        font-size: 20px;
        margin-bottom: 15px;
        color: #c84b4b;
      }

      .project-card p {
        font-size: 14px;
        color: #666;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 뒤쪽 파일 (노란색) -->
      <div class="file-back" id="fileBack">
        <div class="file-tab">Portfolio</div>
        <div class="clip"></div>
      </div>

      <!-- 앞쪽 파일 (핑크색) -->
      <div class="file-front" id="fileFront">
        <div class="file-tab">Portfolio</div>

        <!-- 큰 제목 -->
        <div class="title-container" id="titleContainer">
          <div class="title-main">Olivia</div>
          <div class="title-main">Salazar</div>
          <div class="title-subtitle">
            <span>Scroll-stopping content.</span>
            <div class="badge">UGC Creator</div>
          </div>
        </div>
      </div>

      <!-- 스크롤 안내 -->
      <div class="scroll-indicator" id="scrollIndicator">
        <div style="margin-bottom: 5px">↓</div>
        <div>Scroll</div>
      </div>

      <!-- 메인 컨텐츠 영역 -->
      <div class="content" id="content">
        <h2>프로젝트 소개</h2>
        <div class="projects">
          <div class="project-card">
            <h3>프로젝트 1</h3>
            <p>프로젝트 설명이 들어갈 자리입니다.</p>
          </div>
          <div class="project-card">
            <h3>프로젝트 2</h3>
            <p>프로젝트 설명이 들어갈 자리입니다.</p>
          </div>
          <div class="project-card">
            <h3>프로젝트 3</h3>
            <p>프로젝트 설명이 들어갈 자리입니다.</p>
          </div>
          <div class="project-card">
            <h3>프로젝트 4</h3>
            <p>프로젝트 설명이 들어갈 자리입니다.</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const fileBack = document.getElementById("fileBack");
      const fileFront = document.getElementById("fileFront");
      const titleContainer = document.getElementById("titleContainer");
      const scrollIndicator = document.getElementById("scrollIndicator");
      const content = document.getElementById("content");
      const body = document.body;

      window.addEventListener("scroll", () => {
        const scrollTop = window.scrollY;
        const windowHeight = window.innerHeight;
        const maxScroll = windowHeight * 3;

        const progress = Math.min(scrollTop / maxScroll, 1);

        // 1단계: 제목이 빠르게 아래로 사라짐 (0 ~ 0.15)
        const titlePhase = Math.min(progress / 0.15, 1);
        const titleY = titlePhase * 100;
        const titleOpacity = Math.max(1 - titlePhase * 1.5, 0);

        titleContainer.style.transform = `translate(-50%, calc(-50% + ${titleY}px))`;
        titleContainer.style.opacity = titleOpacity;

        // 2단계: 앞 파일이 아래 왼쪽으로 걷힘 (0.15 ~ 0.5)
        const frontFilePhase = Math.max(
          0,
          Math.min((progress - 0.15) / 0.35, 1)
        );
        const frontFileY = frontFilePhase * 120;
        const frontFileX = frontFilePhase * -30;

        fileFront.style.transform = `translate(${frontFileX}%, ${frontFileY}%) rotate(-2deg)`;

        // 3단계: 뒤 파일이 확대되며 배경으로 전환 (0.5 ~ 1)
        const backFilePhase = Math.max(0, Math.min((progress - 0.5) / 0.5, 1));
        const backFileScale = 1 + backFilePhase * 2.5;
        const backFileRotate = 3 - backFilePhase * 3;
        const backFileOpacity =
          progress < 0.5 ? 1 : Math.max(0, 1 - backFilePhase);

        fileBack.style.transform = `scale(${backFileScale}) rotate(${backFileRotate}deg)`;
        fileBack.style.opacity = backFileOpacity;

        // 컨텐츠 페이드인
        const contentOpacity = Math.max(0, (progress - 0.85) * 5);
        content.style.opacity = contentOpacity;

        if (progress > 0.9) {
          content.classList.add("visible");
          body.classList.add("full-background");
        } else {
          content.classList.remove("visible");
          body.classList.remove("full-background");
        }

        // 스크롤 인디케이터 숨기기
        if (progress > 0.05) {
          scrollIndicator.classList.add("hidden");
        } else {
          scrollIndicator.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
